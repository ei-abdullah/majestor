security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

aws:
  s3:
    buckets:
      bucket: ${S3_BUCKET_NAME}
  region: ${S3_BUCKET_REGION}
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Defaults to local dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SUPPORT_EMAIL}
    password: ${APP_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    com.majestor.api: INFO
    org.springframework.web: INFO

---
# 🛠️ LOCAL DEVELOPMENT (Docker)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/majestor_db
    username: abdullah
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: true

---
# 🚀 PRODUCTION (Digital Ocean)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: {DDL_AUTO:update}
    show-sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect